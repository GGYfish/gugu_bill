name: gugu_bill
description: "咕咕鱼记账 - AI智能全自动记账App"
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 国际化
  flutter_localizations:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 数据库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # 网络
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # 路由
  fluro: ^2.0.5

  # 图表
  fl_chart: ^0.70.2

  # 权限
  permission_handler: ^11.3.1

  # 工具
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6
  # 颜色选择器
  flutter_colorpicker: ^1.1.0
  # 偏好存储
  shared_preferences: ^2.3.3
  # 导出分享
  share_plus: ^10.0.0
  # 导入文件选择
  file_picker: ^9.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
